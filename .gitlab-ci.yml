stages:
  - build
  - deploy

build_dev:
  stage: build
  tags:
    - server213
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'
  variables:
    IMAGE_TAG: dev
  script:
    - docker build -t nexa-dashboard:${IMAGE_TAG}
      --build-arg VITE_API_BASE_URL=${DEV_API_URL}
      --build-arg VITE_REVERB_KEY=${DEV_REVERB_KEY:-nexa-tracking-key-dev}
      --build-arg VITE_REVERB_HOST=${DEV_REVERB_HOST:-dev.nexa.futxtech.com}
      --build-arg VITE_REVERB_PORT=${DEV_REVERB_PORT:-443}
      --build-arg VITE_REVERB_SCHEME=${DEV_REVERB_SCHEME:-https}
      --build-arg VITE_GOOGLE_MAPS_API_KEY=${VITE_GOOGLE_MAPS_API_KEY} .

deploy_dev:
  stage: deploy
  tags:
    - server213
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'
  variables:
    DEPLOY_DIR: /home/gitlab-runner/nexa/dashboard-dev
    IMAGE_TAG: dev
    PRIMARY_PORT: 3101
    CONTAINER_NAME: nexa_dashboard_dev
    COMPOSE_PROJECT_NAME: nexa-dev
  script:
    - |
      set -e
      mkdir -p ${DEPLOY_DIR}
      cp docker-compose.yml ${DEPLOY_DIR}/docker-compose.yml
      cd ${DEPLOY_DIR}
      FALLBACK_PORT=$((PRIMARY_PORT + 100))
      docker compose --env-file .env down 2>/dev/null || true
      if ! ss -tlnp 2>/dev/null | grep -q ":${PRIMARY_PORT} "; then
        PORT=${PRIMARY_PORT}
        echo "Port ${PRIMARY_PORT} is free — using it"
      elif ! ss -tlnp 2>/dev/null | grep -q ":${FALLBACK_PORT} "; then
        PORT=${FALLBACK_PORT}
        echo "Port ${PRIMARY_PORT} occupied — using fallback ${FALLBACK_PORT}"
      else
        echo "ERROR: Both ports ${PRIMARY_PORT} and ${FALLBACK_PORT} are in use by other services"
        exit 1
      fi
      echo "IMAGE_TAG=${IMAGE_TAG}" > .env
      echo "VITE_API_BASE_URL=${DEV_API_URL}" >> .env
      echo "APP_PORT=${PORT}" >> .env
      echo "CONTAINER_NAME=${CONTAINER_NAME}" >> .env
      echo "COMPOSE_PROJECT_NAME=${COMPOSE_PROJECT_NAME}" >> .env
      docker compose --env-file .env config
      docker compose --env-file .env up -d --pull never --force-recreate --remove-orphans
      docker image prune -f

