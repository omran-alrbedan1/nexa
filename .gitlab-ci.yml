# Nexa Dashboard CI/CD Pipeline
# Strategy: Shell executor on server → Build image locally → Deploy via docker-compose
# Runner tag: server213 (must be registered on the target server)

stages:
  - build
  - deploy

# ─── DEV (develop branch) ────────────────────────────────

build_dev:
  stage: build
  tags:
    - server213
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'
  variables:
    IMAGE_TAG: dev
  script:
    - docker build -t nexa-dashboard:${IMAGE_TAG}
        --build-arg VITE_API_BASE_URL=${DEV_API_URL} .

deploy_dev:
  stage: deploy
  tags:
    - server213
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'
  variables:
    DEPLOY_DIR: /home/gitlab-runner/nexa/dashboard-dev
    IMAGE_TAG: dev
    APP_PORT: 3003
    CONTAINER_NAME: nexa_dashboard_dev
    COMPOSE_PROJECT_NAME: nexa-dev
  script:
    - mkdir -p ${DEPLOY_DIR}
    - cp docker-compose.yml ${DEPLOY_DIR}/docker-compose.yml
    - cd ${DEPLOY_DIR}
    - |
      PORT=${APP_PORT}
      if ss -tlnp 2>/dev/null | grep -q ":$PORT "; then
        echo "Port $PORT is in use — trying fallback $((PORT + 100))"
        PORT=$((PORT + 100))
      fi
    - echo "IMAGE_TAG=${IMAGE_TAG}" > .env
    - echo "VITE_API_BASE_URL=${DEV_API_URL}" >> .env
    - echo "APP_PORT=${PORT}" >> .env
    - echo "CONTAINER_NAME=${CONTAINER_NAME}" >> .env
    - echo "COMPOSE_PROJECT_NAME=${COMPOSE_PROJECT_NAME}" >> .env
    - docker compose --env-file .env config
    - docker compose --env-file .env up -d --pull never --force-recreate --remove-orphans
    - docker image prune -f

# ─── PROD (main branch) ─────────────────────────────────

build_prod:
  stage: build
  tags:
    - server213
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  variables:
    IMAGE_TAG: latest
  script:
    - docker build -t nexa-dashboard:${IMAGE_TAG}
        --build-arg VITE_API_BASE_URL=${PROD_API_URL} .

deploy_prod:
  stage: deploy
  tags:
    - server213
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  variables:
    DEPLOY_DIR: /home/gitlab-runner/nexa/dashboard
    IMAGE_TAG: latest
    APP_PORT: 3001
    CONTAINER_NAME: nexa_dashboard_prod
    COMPOSE_PROJECT_NAME: nexa-prod
  script:
    - mkdir -p ${DEPLOY_DIR}
    - cp docker-compose.yml ${DEPLOY_DIR}/docker-compose.yml
    - cd ${DEPLOY_DIR}
    - |
      PORT=${APP_PORT}
      if ss -tlnp 2>/dev/null | grep -q ":$PORT "; then
        echo "Port $PORT is in use — trying fallback $((PORT + 100))"
        PORT=$((PORT + 100))
      fi
    - echo "IMAGE_TAG=${IMAGE_TAG}" > .env
    - echo "VITE_API_BASE_URL=${PROD_API_URL}" >> .env
    - echo "APP_PORT=${PORT}" >> .env
    - echo "CONTAINER_NAME=${CONTAINER_NAME}" >> .env
    - echo "COMPOSE_PROJECT_NAME=${COMPOSE_PROJECT_NAME}" >> .env
    - docker compose --env-file .env config
    - docker compose --env-file .env up -d --pull never --force-recreate --remove-orphans
    - docker image prune -f
