# ─────────────────────────────────────────────────────
#  Nexa Dashboard — Docker Compose
#  Used by GitLab CI/CD deploy stage to run the SPA
#  All variables are injected via .env by the pipeline
# ─────────────────────────────────────────────────────

services:
  nexa-dashboard:
    image: nexa-dashboard:${IMAGE_TAG:-latest}
    container_name: ${CONTAINER_NAME}
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3101}:80"
    networks:
      - central_network
    env_file:
      - .env

networks:
  central_network:
    external: true
